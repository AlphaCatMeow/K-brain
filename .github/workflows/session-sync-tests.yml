name: Session synchronization tests

on:
  pull_request:
    paths:
      - '.github/workflows/session-sync-tests.yml'
      - 'cmd/kn/**'
      - 'docs/liveagent-backend.md'
      - 'internal/acp/**'
      - 'internal/backend/**'
      - 'internal/protocol/**'
      - 'internal/session/**'
      - 'internal/tui/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/session-sync-tests.yml'
      - 'cmd/kn/**'
      - 'docs/liveagent-backend.md'
      - 'internal/acp/**'
      - 'internal/backend/**'
      - 'internal/protocol/**'
      - 'internal/session/**'
      - 'internal/tui/**'

permissions:
  contents: read

jobs:
  platform:
    name: Session sync (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: windows-latest
            target: windows-amd64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare pinned Computer Use runtime
        run: python scripts/prepare-cua.py --target ${{ matrix.target }}
      - name: Check formatting of session-sync files
        shell: pwsh
        run: |
          $files = @(
            'internal/backend/history.go',
            'internal/backend/server.go',
            'internal/backend/session_sync.go',
            'internal/backend/session_sync_test.go',
            'internal/backend/session_sync_review_test.go',
            'internal/protocol/protocol.go',
            'internal/session/metadata.go',
            'internal/session/page.go',
            'internal/session/session.go',
            'internal/session/summary.go',
            'internal/session/summary_test.go',
            'internal/session/summary_review_test.go',
            'internal/session/transcript.go'
          )
          $bad = gofmt -l $files
          if ($bad) { $bad; throw 'gofmt check failed' }
      - name: Build and vet affected packages
        run: |
          go build ./...
          go vet ./internal/session ./internal/backend ./internal/protocol ./internal/acp ./internal/tui ./cmd/kn
      - name: Session, protocol and integration tests
        run: |
          go test ./internal/session ./internal/protocol -count=1
          go test ./internal/backend -run 'TestSession(Snapshot|Changes)' -count=1
          go test ./internal/acp -run 'Test(ListSessions|SessionListWirePaginationAndProjectFilter)$' -count=1
          go test ./cmd/kn -run 'TestSessionsCLI' -count=1
          go test ./internal/tui -run 'TestCtrlCBusyInterruptsNotQuits' -count=1
      - name: Full Linux suite
        if: runner.os == 'Linux'
        run: go test ./... -timeout 60m -count=1
      - name: Race session-sync packages (30x)
        if: runner.os == 'Linux'
        run: |
          go test -race ./internal/session -run 'Test(Summary|TUIStore)' -count=30 -timeout 30m
          go test -race ./internal/backend -run 'TestSession(Snapshot|Changes)' -count=30 -timeout 30m
